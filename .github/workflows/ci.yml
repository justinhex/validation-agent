name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-dut:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S input/dut -B input/dut/build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build input/dut/build --config Release
  
  check-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Check
        run: python -m compileall src